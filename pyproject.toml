[project]
name = "lisa-api"
version = "0.1.0"
description = "FastAPI endpoints for LISA"
readme = "README.md"
authors = [
    { name = "Jemuel B Jeroham", email = "jemuelbjeroham@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "lisa",
    "lisa-mcp-server",
    "pwdlib[argon2]>=0.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "uvicorn>=0.52.4",
]

[project.scripts]
lisa-api = "lisa_api:main"
lisa-api-bootstrap-admin = "lisa_api.bootstrap_admin:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
lisa = { path = "../LISA", editable = true }
lisa-mcp-server = { path = "../lisa-mcp-server", editable = true }
