[project]
name = "lisa-api"
version = "0.1.0"
description = "FastAPI endpoints for LISA"
readme = "README.md"
authors = [
    { name = "Jemuel B Jeroham", email = "jemuelbjeroham@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "lisa",
    "ruff>=0.16.6",
    "uvicorn>=0.52.4",
]

[project.scripts]
lisa-api = "lisa_api:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
lisa = { path = "../LISA", editable = true }
