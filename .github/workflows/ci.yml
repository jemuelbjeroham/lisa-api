name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Install and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out lisa-api
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: lisa-api

      - name: Check out LISA dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jemuelbjeroham/LISA
          path: LISA

      - name: Check out MCP server dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jemuelbjeroham/lisa-mcp-server
          path: lisa-mcp-server

      - name: Verify sibling project checkouts
        run: |
          for project_file in \
            lisa-api/pyproject.toml \
            LISA/pyproject.toml \
            lisa-mcp-server/pyproject.toml; do
            if [[ -f "$GITHUB_WORKSPACE/$project_file" ]]; then
              echo "Found $project_file"
            else
              echo "::error::Missing $project_file under GITHUB_WORKSPACE"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install locked dependencies
        run: uv sync --locked
        working-directory: lisa-api

      - name: Build package
        run: uv build
        working-directory: lisa-api
